name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pc.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean MacBookCam-windows.spec
      - run: Rename-Item dist\MacBookCam.exe MacBookCam-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MacBookCam-Windows
          path: dist/MacBookCam-Windows.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-mac.txt pyinstaller pillow
      - run: python -m PyInstaller --noconfirm --clean MacBookCam-mac.spec
      - name: Smoke test (app starts and stays up)
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" dist/MacBookCam.app/Contents/Info.plist
          dist/MacBookCam.app/Contents/MacOS/MacBookCam > app.log 2>&1 &
          pid=$!
          sleep 10
          cat app.log
          kill -0 $pid || { echo "App exited early"; exit 1; }
          nc -z 127.0.0.1 5005 && echo "Port 5005 is listening"
          kill $pid
      - name: Make DMG
        run: |
          mkdir dmg
          cp -R dist/MacBookCam.app dmg/
          ln -s /Applications dmg/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname MacBookCam -srcfolder dmg -ov -format UDZO               MacBookCam-Mac-${{ matrix.arch }}.dmg && break
            sleep 5
          done
          test -f MacBookCam-Mac-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MacBookCam-Mac-${{ matrix.arch }}
          path: MacBookCam-Mac-${{ matrix.arch }}.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
